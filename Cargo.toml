[workspace]
resolver = "2"
members = ["crates/agora-device", "crates/agora-host", "crates/agora-m18", "src-tauri"]

[workspace.package]
version = "0.9.2"
edition = "2021"
license = "MIT"
authors = ["overture-sys"]
repository = "https://gitlab.com/overture-group1/agora"

[workspace.dependencies]
agora-device = { path = "crates/agora-device" }
agora-host = { path = "crates/agora-host" }
hidapi = { version = "2", default-features = false, features = ["windows-native", "linux-static-hidraw"] }
# Elgato Stream Deck driver (MPL-2.0). Used unchanged, as a dependency.
elgato-streamdeck = { version = "=0.14.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }
thiserror = "2"
# Boot logos: baseline JPEG with 4:2:0 chroma, as MiraBox's SDK makes them (MIT/Apache-2.0).
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
