[workspace]
resolver = "2"
members = ["crates/agora-device", "crates/agora-host", "crates/agora-m18", "src-tauri"]

[workspace.package]
version = "0.7.1"
edition = "2021"
license = "MIT"
authors = ["overture-sys"]
repository = "https://gitlab.com/overture-group1/agora"

[workspace.dependencies]
agora-device = { path = "crates/agora-device" }
agora-host = { path = "crates/agora-host" }
hidapi = { version = "2", default-features = false, features = ["windows-native", "linux-static-hidraw"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
thiserror = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
