[package]
name = "agora-host"
description = "Agora's plugin host: runs Stream Dock plugins unchanged"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
agora-device.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
image.workspace = true
percent-encoding = "2"
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "process", "time", "macros", "fs"] }

[dev-dependencies]
tempfile = "3"
