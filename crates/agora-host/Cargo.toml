[package]
name = "agora-host"
description = "Agora's plugin host: runs Stream Dock plugins unchanged"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
agora-device.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
image.workspace = true
percent-encoding = "2"
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "process", "time", "macros", "fs"] }

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }
