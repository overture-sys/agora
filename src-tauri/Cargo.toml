[package]
name = "agora"
description = "Agora: a free, open-source app for Stream Dock devices"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agora-device.workspace = true
agora-host.workspace = true
base64 = "0.22"
image.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[features]
# Loads the built UI from inside the exe. The Tauri CLI turns this on for
# release builds; pass it yourself when building with plain cargo.
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(windows)".dependencies]
enigo = "0.6.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Media_Multimedia", "Win32_Security_Credentials", "Win32_System_Power", "Win32_System_Shutdown", "Win32_Graphics_Gdi"] }
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem"] }
